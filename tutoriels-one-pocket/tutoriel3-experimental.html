function voicelang(){if(!('speechSynthesis' in window))return null;return speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().split('-')[0]===lang)}
function say(fr,native){if(!('speechSynthesis' in window))return;const voice=lang!=='fr'?voicelang():speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));if(lang!=='fr'&&!voice){$('live').textContent=t('noAudio');return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(lang==='fr'?fr:native);utter.lang=voice?.lang||(lang==='fr'?'fr-FR':lang);if(voice)utter.voice=voice;utter.rate=.85;speechSynthesis.speak(utter)}

function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{route=b.dataset.open;index=0;guide=true;hit=false;lesson();window.scrollTo(0,0)});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{index=+b.dataset.step;guide=!ROUTES[route].steps[index]?.independent;hit=false;lesson();window.scrollTo(0,0)});document.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{const target=b.dataset.hit;if(view==='map'){selectedMap=target.replace('nav-','');map();return}if(view!=='lesson')return;if(target===wanted()){hit=true;$('live').textContent=t('feedback');document.querySelectorAll('.target').forEach(el=>el.classList.remove('target'))}else{$('live').textContent=t('retry')}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='home'){home();return}if(a==='open-map'){selectedMap='';map();return}if(a.startsWith('open:')){route=a.split(':')[1];index=0;guide=true;lesson();return}if(a==='restart'){index=0;guide=true;lesson();return}if(a==='toggle-help'){guide=!guide;lesson();return}if(a.startsWith('voice-')){const st=ROUTES[route].steps[index];say(st.text,TR[lang]?.[st.key]||st.text);return}if(a==='hit:'){return}if(a.startsWith('hit:')){const p=a.slice(4);if(p===wanted()){$('live').textContent=t('feedback');hit=true}else{$('live').textContent=t('retry')}}})}
function refreshLanguage(){try{localStorage.setItem('onepocket_language',lang)}catch(e){}$('lang').value=lang;$('langLabel').textContent=lang==='fr'?'Langue':L[lang].name;$('homeNav').textContent=t('home');if(view==='home')home();if(view==='map')map();if(view==='lesson')lesson();if(view==='end')end()}
$('lang').onchange=e=>{lang=e.target.value;refreshLanguage()};$('back').onclick=()=>{if(index>0){index--;guide=!ROUTES[route].steps[index]?.independent;lesson();window.scrollTo(0,0)}else{home();window.scrollTo(0,0)}};$('next').onclick=()=>{index++;guide=!ROUTES[route].steps[index]?.independent;lesson();window.scrollTo(0,0)};
$('homeLink').onclick=e=>{e.preventDefault();home()};refreshLanguage();
</script></body></html>
